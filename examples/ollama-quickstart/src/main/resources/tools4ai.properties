# Ollama serves an OpenAI-compatible API, so Tools4AI talks to it with its OpenAI processor.
# Any non-empty key works; Ollama ignores it.
openAiKey=ollama
openAiBaseURL=http://localhost:11434/v1
# Left blank on purpose: QuickStart picks a default, or pass -DopenAiModelName=<ollama model>
openAiModelName=
# Minutes to wait for a reply; local models on a CPU can be slow
maxTimeOutForOpenAI=3
# Only scan this package for @Agent classes (scanning the whole classpath is slow)
action.packages.to.scan=quickstart
